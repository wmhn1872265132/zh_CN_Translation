name: Update NVDA Translations

on:
  workflow_dispatch:

env:
  crowdinAuthToken: ${{ secrets.NVDA_CROWDIN }}
  GH_TOKEN: ${{ github.token }}
  BRANCH: Uploads

jobs:
  Update-Translations:
    name: Update translations
    if: ${{ vars.Run_NVDA_Translations_Workflow }}
    runs-on: windows-latest
    steps:
      - name: Checkout ${{ github.repository }} repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}
      - parallel:
          - name: Install dependencies
            uses: ./.github/actions/InstallDependencies
          - name: Checkout NVDA zh_CN locale folder
            uses: actions/checkout@v7
            with:
              repository: nvaccess/nvda
              ref: beta
              path: ${{ github.workspace }}/ProcessTranslation/NVDA
              sparse-checkout: |
                source/locale/zh_CN/characterDescriptions.dic
                source/locale/zh_CN/gestures.ini
                source/locale/zh_CN/symbols.dic
      - name: Update Translations From Crowdin
        id: crowdin_translations
        run: |
          ${{ github.workspace }}/L10nUtilTools.bat DLA
          git add --update Translation
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
              git commit -m "更新翻译（从 Crowdin）"
          } else {
              Write-Host "No changes to commit, skipping commit."
          }
      - name: Push changes
        shell: pwsh
        run: |
          git pull --rebase
          git push
          gh workflow run build.yaml --ref ${{ env.BRANCH }} --repo ${{ github.repository }}
